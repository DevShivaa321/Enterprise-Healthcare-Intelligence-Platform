<div
  style="
    display: flex;
    align-items: center;
    justify-content: center;
    height: 100vh;
    background: #f4f6f9;
  "
>
   
  <div
    style="
      background: white;
      padding: 2.5rem;
      border-radius: 12px;
      border: 0.5px solid #e0e0e0;
      width: 360px;
    "
  >
       
    <div style="text-align: center; margin-bottom: 2rem">
            <i class="pi pi-plus-circle" style="font-size: 2.5rem; color: #d32f2f"></i>

           
      <h2 style="margin: 8px 0 4px; color: #1e3a5f">CDSS</h2>

           
      <p style="color: #888; font-size: 13px; margin: 0">Clinical Decision Support System</p>

         
    </div>

       
    <div style="margin-bottom: 1rem">
           
      <label style="display: block; margin-bottom: 4px; font-size: 13px; color: #555"
        >Username</label
      >

           
      <input
        pInputText
        [(ngModel)]="loginName"
         
         
         
         
        placeholder="Enter username"
         
         
         
         
        style="width: 100%"
         
         
         
         
        (keyup.enter)="login()"
      />

         
    </div>

       
    <div style="margin-bottom: 1.5rem">
           
      <label style="display: block; margin-bottom: 4px; font-size: 13px; color: #555"
        >Password</label
      >

           
      <input
        pInputText
        type="password"
        [(ngModel)]="password"
         
         
         
         
        placeholder="Enter password"
         
         
         
         
        style="width: 100%"
         
         
         
         
        (keyup.enter)="login()"
      />

         
    </div>

       
    <p
      *ngIf="errorMessage"
       
       
       
      style="color: #e74c3c; font-size: 13px; margin-bottom: 1rem; text-align: center"
    >
            {{ errorMessage }}

         
    </p>

       
    <p-button
       
       
       
      label="Login"
       
       
       
      icon="pi pi-sign-in"
       
       
       
      styleClass="w-full"
       
       
       
      [style]="{ width: '100%' }"
       
       
       
      (onClick)="login()"
    />

     
  </div>
</div>
